<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Grilla de Adiestramiento</title>

<!-- ===== App instalable (PWA) ===== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F5233">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Adiestramiento">
<meta name="description" content="Registro de adiestramiento canino: conductas, series, cronograma y datos del perro.">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --campo:#2F5233;
    --campo-osc:#223D26;
    --premio:#E8A33D;
    --premio-suave:#F6E3C2;
    --fondo:#EEF1EA;
    --tarjeta:#FFFFFF;
    --tinta:#1E2420;
    --tinta-suave:#5C665C;
    --linea:#D8DED3;
    --peligro:#B23A3A;
    --peligro-f:#F3E5E5;
    --exito:#3E7B4F;
    --insumo:#FAFBF8;
    --pista:#E3E8DF;
    --panel:#F6F8F3;
    --form-f:#FFFDF6;
    --activo-f:#FFFDF8;
    --ph:#A9B2A6;
    --head-tx:#F4F7F2;
    --head-sub:#C9D4C6;
    --head-save:#9FB39C;
    --radio:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Public Sans',system-ui,sans-serif;
    background:var(--fondo);
    color:var(--tinta);
    padding-bottom:96px;
  }
  header{
    background:var(--campo);
    color:var(--head-tx);
    padding:20px 20px 0;
    border-radius:0 0 24px 24px;
    position:relative;
  }
  .eyebrow{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--premio);font-weight:700;margin-bottom:6px;
    padding-right:44px;
  }
  h1{
    font-family:'Bricolage Grotesque',sans-serif;
    font-size:25px;font-weight:800;line-height:1.15;
    padding-right:44px;
  }
  .resumen{margin-top:8px;font-size:13px;color:var(--head-sub)}
  .estado-guardado{margin-top:4px;font-size:12px;color:var(--head-save);min-height:16px}
  .btn-volver{
    border:none;background:rgba(255,255,255,.14);color:var(--head-tx);
    border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;
    font-family:inherit;cursor:pointer;margin-bottom:12px;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn-volver:active{background:rgba(255,255,255,.25)}

  .btn-config{
    position:absolute;top:16px;right:14px;
    width:40px;height:40px;border-radius:12px;border:none;
    background:rgba(255,255,255,.14);color:var(--head-tx);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .btn-config:active{background:rgba(255,255,255,.28)}
  .btn-config svg{width:22px;height:22px}

  .sel-perro{
    margin-top:10px;width:100%;
    border:1.5px solid rgba(255,255,255,.3);border-radius:12px;
    background:rgba(255,255,255,.12);color:var(--head-tx);
    padding:11px 12px;font-family:inherit;font-size:15px;font-weight:600;
  }
  .sel-perro:focus{outline:none;border-color:var(--premio)}
  .sel-perro option{color:#1E2420;background:#fff}

  .pestanas{display:flex;gap:6px;margin-top:14px}
  .pestana{
    flex:1;border:none;font-family:inherit;font-size:13.5px;font-weight:700;
    padding:12px 4px;cursor:pointer;
    background:rgba(255,255,255,.10);color:var(--head-sub);
    border-radius:12px 12px 0 0;
  }
  .pestana.activa{background:var(--fondo);color:var(--campo)}
  header.sin-pestanas{padding-bottom:24px}

  /* ---- Planilla veterinaria ---- */
  .fila-doble{display:flex;gap:10px}
  .fila-doble > div{flex:1;min-width:0}
  .estado-vac{font-size:12.5px;font-weight:600;margin-top:-4px;margin-bottom:10px;min-height:16px}
  .estado-vac.vencida{color:var(--peligro)}
  .estado-vac.proxima{color:var(--premio)}
  .estado-vac.ok{color:var(--exito)}
  .nota-vet{
    font-size:13px;color:var(--tinta-suave);background:var(--panel);
    border-radius:12px;padding:12px;line-height:1.45;
  }

  main{padding:16px 14px 0;max-width:560px;margin:0 auto}

  .tarjeta-lista{
    background:var(--tarjeta);
    border:1px solid var(--linea);
    border-radius:var(--radio);
    padding:14px;
    margin-bottom:12px;
    box-shadow:0 2px 6px rgba(30,36,32,.08);
    cursor:pointer;
    display:flex;align-items:center;gap:12px;
  }
  .tarjeta-lista:active{border-color:var(--premio);background:var(--activo-f)}
  .info-lista{flex:1;min-width:0}
  .nombre-lista{
    font-family:'Bricolage Grotesque',sans-serif;
    font-size:18px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .nombre-lista.sin-nombre{color:var(--ph)}
  .desc-lista{
    font-size:12.5px;color:var(--tinta-suave);margin-top:3px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;
  }
  .huellas-mini{display:flex;gap:3px;margin-top:6px}
  .huellas-mini svg{width:18px;height:18px}
  .huellas-mini .relleno{fill:var(--pista)}
  .huellas-mini .activa .relleno{fill:var(--premio)}
  .stats-lista{margin-top:6px;font-size:12.5px;color:var(--tinta-suave)}
  .stats-lista b{color:var(--exito)}
  .flecha{color:var(--ph);font-size:20px;flex-shrink:0}
  .orden-col{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
  .btn-orden{
    width:38px;height:38px;border-radius:10px;border:1.5px solid var(--linea);
    background:var(--insumo);color:var(--campo);font-size:16px;font-weight:700;
    cursor:pointer;line-height:1;
  }
  .btn-orden:active:not(:disabled){background:var(--premio-suave);border-color:var(--premio)}
  .btn-orden:disabled{opacity:.25;cursor:default}

  .tarjeta{
    background:var(--tarjeta);
    border:1px solid var(--linea);
    border-radius:var(--radio);
    padding:16px 14px 14px;
    margin-bottom:14px;
    box-shadow:0 2px 6px rgba(30,36,32,.08);
  }
  .fila-titulo{display:flex;align-items:center;gap:8px}
  .nombre-truco{
    flex:1;border:none;background:transparent;
    font-family:'Bricolage Grotesque',sans-serif;
    font-size:20px;font-weight:700;color:var(--tinta);
    padding:4px 2px;border-bottom:2px dashed transparent;min-width:0;
  }
  .nombre-truco:focus{outline:none;border-bottom-color:var(--premio)}
  .nombre-truco::placeholder{color:var(--ph);font-weight:600}
  .btn-borrar{
    border:none;background:transparent;color:var(--tinta-suave);
    font-size:20px;line-height:1;padding:8px;border-radius:10px;cursor:pointer;flex-shrink:0;
  }
  .btn-borrar:active{background:var(--peligro-f);color:var(--peligro)}

  .bloque{margin-top:14px}
  .etiqueta{
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    font-weight:700;color:var(--tinta-suave);margin-bottom:6px;display:block;
  }
  .huellas{display:flex;gap:6px;align-items:center}
  .huella{border:none;background:transparent;padding:4px;cursor:pointer;border-radius:8px}
  .huella svg{width:34px;height:34px;display:block}
  .huella .relleno{fill:var(--pista);transition:fill .15s}
  .huella.activa .relleno{fill:var(--premio)}
  .huella:active{transform:scale(1.12)}
  .texto-estadio{margin-left:6px;font-size:13px;font-weight:600;color:var(--tinta-suave)}

  .acumulado{display:flex;gap:8px;margin-top:6px}
  .dato-acum{
    flex:1;background:var(--insumo);border:1.5px solid var(--linea);
    border-radius:12px;padding:10px 6px;text-align:center;
  }
  .dato-acum .valor{
    font-family:'Bricolage Grotesque',sans-serif;
    font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;
  }
  .dato-acum .valor.verde{color:var(--exito)}
  .dato-acum .desc{font-size:11px;color:var(--tinta-suave);margin-top:2px;font-weight:600}
  .barra-exito{margin-top:10px;height:10px;border-radius:999px;background:var(--pista);overflow:hidden}
  .barra-exito > div{height:100%;background:var(--exito);border-radius:999px;transition:width .25s}

  .form-serie{background:var(--form-f);border:1.5px dashed var(--premio)}
  .sub-etiqueta{font-size:12.5px;font-weight:600;color:var(--tinta-suave);margin-bottom:4px;display:block}
  .fila-reps{display:flex;align-items:center;gap:10px}
  .btn-paso{
    width:44px;height:44px;border-radius:12px;border:1.5px solid var(--linea);
    background:var(--insumo);font-size:22px;font-weight:700;color:var(--campo);
    cursor:pointer;flex-shrink:0;
  }
  .btn-paso:active:not(:disabled){background:var(--premio-suave);border-color:var(--premio)}
  .btn-paso:disabled{opacity:.35;cursor:default}
  .num-reps{
    width:72px;text-align:center;font-size:20px;font-weight:700;
    border:none;background:transparent;color:var(--tinta);
    font-variant-numeric:tabular-nums;
  }
  .num-reps:focus{outline:2px solid var(--premio);border-radius:8px}
  .aviso-error{margin-top:6px;font-size:12.5px;color:var(--peligro);min-height:16px}
  .grupo-reps{margin-bottom:10px}

  .obs{
    width:100%;border:1.5px solid var(--linea);border-radius:12px;
    background:var(--insumo);padding:10px 12px;font-family:inherit;font-size:14px;
    color:var(--tinta);resize:none;min-height:56px;line-height:1.45;
  }
  .obs:focus{outline:none;border-color:var(--premio)}
  .obs::placeholder{color:var(--ph)}

  .btn-guardar-serie{
    width:100%;margin-top:12px;background:var(--campo);color:#fff;border:none;
    border-radius:12px;padding:14px;font-size:15px;font-weight:700;font-family:inherit;
    cursor:pointer;
  }
  .btn-guardar-serie:active{background:var(--campo-osc)}
  .btn-guardar-serie:disabled{opacity:.4;cursor:default}

  .titulo-historial{
    font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:700;
    margin:18px 2px 10px;
  }
  .serie{
    background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;
    padding:12px 14px;margin-bottom:10px;
  }
  .serie-cab{display:flex;align-items:baseline;gap:8px}
  .serie-num{
    font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:15px;
    color:var(--campo);
  }
  .serie-fecha{font-size:12px;color:var(--tinta-suave);flex:1}
  .btn-borrar-serie{
    border:none;background:transparent;color:var(--tinta-suave);font-size:16px;
    padding:4px 8px;border-radius:8px;cursor:pointer;
  }
  .btn-borrar-serie:active{background:var(--peligro-f);color:var(--peligro)}
  .serie-datos{margin-top:6px;font-size:14px}
  .serie-datos b{color:var(--exito)}
  .serie-estadio{margin-top:4px;font-size:12.5px;color:var(--tinta-suave)}
  .serie-estadio b{color:var(--premio);font-weight:700}
  .serie-barra{margin-top:6px;height:7px;border-radius:999px;background:var(--pista);overflow:hidden}
  .serie-barra > div{height:100%;background:var(--exito);border-radius:999px}
  .serie-obs{margin-top:8px;font-size:13.5px;color:var(--tinta-suave);line-height:1.45;white-space:pre-wrap}
  .serie-obs.vacia{font-style:italic;color:var(--ph)}
  .serie-refuerzo{margin-top:6px;font-size:12.5px;color:var(--tinta-suave)}
  .serie-refuerzo b{color:var(--campo);font-weight:700}
  body.tema-oscuro .serie-refuerzo b{color:var(--exito)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{
    display:inline-flex;align-items:center;
    border:1.5px solid var(--linea);border-radius:999px;
    background:var(--insumo);overflow:hidden;max-width:100%;
  }
  .chip.sel{border-color:var(--premio);background:var(--premio-suave)}
  .chip-txt{
    border:none;background:transparent;font-family:inherit;font-size:13px;
    font-weight:600;color:var(--tinta);padding:8px 4px 8px 12px;cursor:pointer;
    max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .chip-x{
    border:none;background:transparent;color:var(--ph);font-size:12px;
    padding:8px 10px 8px 6px;cursor:pointer;font-family:inherit;
  }
  .chip-x.confirmando{border-radius:0}
  .sin-series{
    text-align:center;font-size:13.5px;color:var(--tinta-suave);
    padding:14px;background:var(--panel);border-radius:12px;
  }
  .btn-eliminar-truco{
    width:100%;margin-top:18px;background:transparent;color:var(--peligro);
    border:1.5px solid var(--peligro);border-radius:12px;padding:13px;
    font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
  }
  .btn-eliminar-truco:active{background:var(--peligro-f)}
  .confirmando{
    background:var(--peligro) !important;
    color:#fff !important;
    border-color:var(--peligro) !important;
    font-size:13px !important;
    font-weight:700;
  }

  .selector, .input-hora, .input-texto{
    width:100%;border:1.5px solid var(--linea);border-radius:12px;
    background:var(--insumo);padding:12px;font-family:inherit;font-size:15px;
    color:var(--tinta);margin-bottom:10px;
  }
  .selector:focus, .input-hora:focus, .input-texto:focus{outline:none;border-color:var(--premio)}
  .input-texto::placeholder{color:var(--ph)}
  .dia-card{
    background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);
    padding:12px 14px;margin-bottom:12px;
  }
  .dia-nombre{
    font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:800;
    color:var(--campo);
  }
  body.tema-oscuro .dia-nombre{color:var(--premio)}
  .dia-vacio{font-size:13px;color:var(--ph);font-style:italic;margin-top:6px}
  .item-crono{
    display:flex;align-items:flex-start;gap:10px;
    padding:10px 0;border-top:1px solid var(--linea);margin-top:8px;
  }
  .item-crono:first-of-type{border-top:none}
  .hora-crono{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;
    color:var(--premio);min-width:52px;padding-top:1px;
  }
  .hora-crono.sin-hora{color:var(--ph);font-weight:600;font-size:12.5px}
  .cuerpo-crono{flex:1;min-width:0}
  .truco-crono{font-weight:700;font-size:15px}
  .truco-crono.eliminado{color:var(--peligro);font-weight:600;font-style:italic}
  .nota-crono{font-size:13px;color:var(--tinta-suave);margin-top:2px;line-height:1.4;white-space:pre-wrap}

  .perro-card{
    background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);
    padding:14px;margin-bottom:12px;
  }
  .perro-card.activo{border:2px solid var(--premio);background:var(--form-f)}
  .perro-fila{display:flex;align-items:center;gap:8px}
  .nombre-perro{
    flex:1;border:none;background:transparent;
    font-family:'Bricolage Grotesque',sans-serif;
    font-size:18px;font-weight:700;color:var(--tinta);
    padding:4px 2px;border-bottom:2px dashed transparent;min-width:0;
  }
  .nombre-perro:focus{outline:none;border-bottom-color:var(--premio)}
  .nombre-perro::placeholder{color:var(--ph)}
  .badge-activo{
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    background:var(--premio);color:#fff;border-radius:999px;padding:5px 10px;flex-shrink:0;
  }
  .btn-usar{
    border:1.5px solid var(--campo);background:transparent;color:var(--campo);
    border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;
    font-family:inherit;cursor:pointer;flex-shrink:0;
  }
  body.tema-oscuro .btn-usar{border-color:var(--premio);color:var(--premio)}
  .btn-usar:active{background:var(--premio-suave)}
  .perro-stats{margin-top:8px;font-size:12.5px;color:var(--tinta-suave)}
  .btn-borrar-perro{
    margin-top:10px;width:100%;background:transparent;color:var(--peligro);
    border:1.5px solid var(--peligro-f);border-radius:10px;padding:9px;
    font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;
  }
  .btn-borrar-perro:active{background:var(--peligro-f)}

  /* ---- Configuración ---- */
  .overlay-config{
    position:fixed;inset:0;background:rgba(20,26,21,.55);z-index:50;
    overflow-y:auto;padding:20px 14px 40px;
  }
  .panel-config{
    max-width:560px;margin:0 auto;background:var(--fondo);
    border-radius:20px;padding:18px 16px;
  }
  .config-cab{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .config-titulo{
    flex:1;font-family:'Bricolage Grotesque',sans-serif;
    font-size:21px;font-weight:800;
  }
  .btn-cerrar{
    border:none;background:var(--tarjeta);border:1px solid var(--linea);
    color:var(--tinta);width:40px;height:40px;border-radius:12px;
    font-size:18px;cursor:pointer;
  }
  .btn-cerrar:active{background:var(--pista)}
  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .swatch{
    width:64px;border:none;background:transparent;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    font-family:inherit;font-size:11px;font-weight:600;color:var(--tinta-suave);
    padding:4px;border-radius:12px;
  }
  .swatch .bola{
    width:44px;height:44px;border-radius:50%;border:3px solid transparent;
  }
  .swatch.activo .bola{border-color:var(--tinta)}
  .area-datos{
    width:100%;border:1.5px solid var(--linea);border-radius:12px;
    background:var(--insumo);padding:10px;font-family:monospace;font-size:11px;
    color:var(--tinta);min-height:90px;resize:vertical;
  }
  .aviso-config{font-size:12.5px;margin-top:6px;min-height:16px;font-weight:600}
  .aviso-config.ok{color:var(--exito)}
  .aviso-config.err{color:var(--peligro)}

  .btn-agregar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:18px;
    background:var(--campo);color:#fff;border:none;border-radius:999px;
    padding:15px 26px;font-size:16px;font-weight:700;font-family:inherit;
    box-shadow:0 6px 18px rgba(20,30,22,.4);cursor:pointer;
    display:flex;align-items:center;gap:8px;z-index:10;
  }
  .btn-agregar:active{background:var(--campo-osc)}
  .btn-agregar svg{width:18px;height:18px}
  .btn-agregar.oculto{display:none}

  .vacio{text-align:center;padding:56px 24px;color:var(--tinta-suave)}
  .vacio svg{width:64px;height:64px;margin-bottom:14px}
  .vacio .relleno{fill:var(--pista)}
  .vacio h2{font-family:'Bricolage Grotesque',sans-serif;font-size:19px;color:var(--tinta);margin-bottom:6px}
  .vacio p{font-size:14px;line-height:1.5}

  .pie-ayuda{
    text-align:center;font-size:12px;color:var(--tinta-suave);
    padding:4px 24px 10px;max-width:560px;margin:0 auto;
  }
  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>

<header id="cabecera"></header>
<main id="lista"></main>
<p class="pie-ayuda" id="ayuda"></p>

<button class="btn-agregar" id="btnAgregar" aria-label="Agregar truco">
  <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
  <span id="btnAgregarTxt">Agregar truco</span>
</button>

<script>
const CLAVE_VIEJA = 'grilla-adiestramiento-v1';
const CLAVE_CRONO_VIEJA = 'grilla-cronograma-v1';
const CLAVE_PERROS = 'grilla-perros-v1';

/* ====== Almacenamiento local del teléfono ======
   Guarda en localStorage (queda en el dispositivo, sin servidores).
   Si el navegador lo bloquea (modo privado, permisos), cae a memoria
   temporal para que la app siga funcionando durante la sesión. */
const memoriaTemporal = {};
let almacenamientoOk = true;
try{
  const prueba = '__prueba_grilla__';
  localStorage.setItem(prueba, '1');
  localStorage.removeItem(prueba);
}catch(e){ almacenamientoOk = false; }

const store = {
  get(clave){
    try{
      if(!almacenamientoOk) throw new Error('sin localStorage');
      const v = localStorage.getItem(clave);
      return v === null ? null : { value: v };
    }catch(e){
      return (clave in memoriaTemporal) ? { value: memoriaTemporal[clave] } : null;
    }
  },
  set(clave, valor){
    try{
      if(!almacenamientoOk) throw new Error('sin localStorage');
      localStorage.setItem(clave, valor);
      return true;
    }catch(e){
      memoriaTemporal[clave] = valor;
      return false;
    }
  }
};

function t(k, vars){
  let s = (L[cfg.idioma] && L[cfg.idioma][k]);
  if(s === undefined) s = L.es[k];
  if(s === undefined) return k;
  if(vars && typeof s === 'string'){
    for(const key in vars) s = s.split('{'+key+'}').join(vars[key]);
  }
  return s;
}

  VARS_TEMA.forEach(v=>root.style.removeProperty(v));
  const tema = TEMAS[cfg.tema] || {};

/* ================= MODELO ================= */
function nuevoPerro(nombre){
  return {
    id: 'p' + Date.now() + Math.floor(Math.random()*1000),
    nombre: nombre || '',
    sexo: '',
    vet: vetVacio(),
    trucos: [],
    cronograma: []
  };
}
function vetVacio(){
  return {
    nacimiento: '', raza: '', peso: '',
    antirrabicaUltima: '', antirrabicaProxima: '',
    sextupleUltima: '', sextupleProxima: '',
    castrado: '', ultimoCelo: ''
  };
}
function perroActual(){
  return datos.perros.find(p=>p.id===datos.activo) || null;
}
function activarRefs(){
  const p = perroActual();
  items = p ? p.trucos : [];
  cronograma = p ? p.cronograma : [];
}
function setItems(arr){
  const p = perroActual();
  if(p) p.trucos = arr;
  items = arr;
}
function setCronograma(arr){
  const p = perroActual();
  if(p) p.cronograma = arr;
  cronograma = arr;
}
function nuevoItem(){
  return {
    id: 'i' + Date.now() + Math.floor(Math.random()*1000),
    truco: '', descripcion: '', estadio: 1, series: []
  };
}

function migrarTrucos(arr){
  return arr.map(it=>{
    if(typeof it.descripcion !== 'string') it.descripcion = '';
    if(!Array.isArray(it.series)){
      it.series = [];
      const total = (typeof it.total === 'number') ? it.total
                  : (typeof it.reps === 'number') ? it.reps : 0;
      const exitos = (typeof it.exitos === 'number') ? Math.min(it.exitos, total) : 0;
      const obs = it.obs || '';
      if(total > 0 || obs.trim()){
        it.series.push({
          id: 's' + Date.now() + Math.floor(Math.random()*1000),
          fecha: null, total: total, exitos: exitos, obs: obs
        });
      }
      delete it.total; delete it.exitos; delete it.obs; delete it.reps;
    }
    return it;
  });
}

function sanearDatos(){
  if(!Array.isArray(datos.refuerzos)) datos.refuerzos = [];
  if(!Array.isArray(datos.perros) || datos.perros.length === 0){
    const p = nuevoPerro(t('miPerro'));
    datos = { activo: p.id, perros: [p] };
  }
  if(!datos.perros.some(p=>p.id===datos.activo)){
    datos.activo = datos.perros[0].id;
  }
  datos.perros.forEach(p=>{
    if(!Array.isArray(p.trucos)) p.trucos = [];
    if(!Array.isArray(p.cronograma)) p.cronograma = [];
    if(typeof p.sexo !== 'string') p.sexo = '';
    if(!p.vet || typeof p.vet !== 'object') p.vet = vetVacio();
    const base = vetVacio();
    Object.keys(base).forEach(k=>{ if(typeof p.vet[k] !== 'string') p.vet[k] = base[k]; });
    p.trucos = migrarTrucos(p.trucos);
  });
}

async function cargar(){
  try{
    const c = store.get(CLAVE_CONFIG);
    if(c && c.value){
      const parsed = JSON.parse(c.value);
      if(parsed.idioma && L[parsed.idioma]) cfg.idioma = parsed.idioma;
      if(parsed.tema && TEMAS[parsed.tema] !== undefined) cfg.tema = parsed.tema;
    }
  }catch(e){}
  aplicarTema();

  let cargado = false;
  try{
    const r = store.get(CLAVE_PERROS);
    if(r && r.value){
      datos = JSON.parse(r.value);
      cargado = true;
    }
  }catch(e){}

  if(!cargado){
    let trucosViejos = [], cronoViejo = [];
    try{
      const r = store.get(CLAVE_VIEJA);
      if(r && r.value) trucosViejos = migrarTrucos(JSON.parse(r.value));
    }catch(e){}
    try{
      const c = store.get(CLAVE_CRONO_VIEJA);
      if(c && c.value) cronoViejo = JSON.parse(c.value);
    }catch(e){}
    const primero = nuevoPerro(t('miPerro'));
    primero.trucos = trucosViejos;
    primero.cronograma = cronoViejo;
    datos = { activo: primero.id, perros: [primero] };
  }

  sanearDatos();
  activarRefs();
  render();
}

function escapar(x){
  return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function conConfirmacion(btn, htmlOriginal, textoConfirm, accion){
  let armado = false, timer = null;
  btn.addEventListener('click', ()=>{
    if(!armado){
      armado = true;
      btn.innerHTML = textoConfirm;
      btn.classList.add('confirmando');
      timer = setTimeout(()=>{
        armado = false;
        btn.innerHTML = htmlOriginal;
        btn.classList.remove('confirmando');
      }, 3000);
    } else {
      clearTimeout(timer);
      accion();
    }
  });
}

function acumulado(item){
  let total = 0, exitos = 0;
  item.series.forEach(s=>{ total += s.total; exitos += s.exitos; });
  const pct = total > 0 ? Math.round(100*exitos/total) : null;
  return {total, exitos, pct, cantSeries: item.series.length};
}

function fechaLegible(iso){
  if(!iso) return t('registroSinFecha');
  const d = new Date(iso);
  const ab = t('abrev');
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return ab[d.getDay()] + ' ' + dd + '/' + mm + '/' + d.getFullYear() + ' · ' + hh + ':' + mi;
}

/* ================= VETERINARIA ================= */
function calcularEdad(fechaNac){
  if(!fechaNac) return null;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const nac = new Date(fechaNac + 'T00:00:00');
  if(isNaN(nac.getTime()) || nac > hoy) return null;

  let anios = hoy.getFullYear() - nac.getFullYear();
  let meses = hoy.getMonth() - nac.getMonth();
  if(hoy.getDate() < nac.getDate()) meses--;
  if(meses < 0){ anios--; meses += 12; }

  if(anios <= 0 && meses <= 0){
    const dias = Math.floor((hoy - nac) / 86400000);
    return dias + ' ' + (dias===1 ? t('dia') : t('diasU'));
  }
  if(anios <= 0){
    return meses + ' ' + (meses===1 ? t('mes') : t('meses'));
  }
  let s = anios + ' ' + (anios===1 ? t('anio') : t('anios'));
  if(meses > 0) s += ' ' + t('y') + ' ' + meses + ' ' + (meses===1 ? t('mes') : t('meses'));
  return s;
}

function textoDias(d){
  return d + ' ' + (d===1 ? t('dia') : t('diasU'));
}

function estadoRevacunacion(fechaProxima){
  if(!fechaProxima) return {clase:'', texto:''};
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const prox = new Date(fechaProxima + 'T00:00:00');
  const dias = Math.round((prox - hoy) / 86400000);
  if(dias < 0) return {clase:'vencida', texto: t('vencidaHace', {d: textoDias(Math.abs(dias))})};
  if(dias === 0) return {clase:'vencida', texto: t('revacHoy')};
  if(dias <= 30) return {clase:'proxima', texto: t('faltanRevac', {d: textoDias(dias)})};
  return {clase:'ok', texto: t('alDia', {d: textoDias(dias)})};
}

    card.appendChild(btnDatos);

    card.querySelector('.nombre-perro').addEventListener('input', e=>{
      p.nombre = e.target.value;
      programarGuardado();
    });

    const btnUsar = card.querySelector('.btn-usar');
    if(btnUsar){
      btnUsar.addEventListener('click', ()=>{
        datos.activo = p.id;
        activarRefs();
        vistaActual = null;
        programarGuardado();
        render();
      });
    }

    if(datos.perros.length > 1){
      const btnBorrar = document.createElement('button');
      btnBorrar.className = 'btn-borrar-perro';
      btnBorrar.textContent = t('eliminarPerfil');
      conConfirmacion(btnBorrar, t('eliminarPerfil'), t('confirmEliminarPerfil'), ()=>{
        datos.perros = datos.perros.filter(x=>x.id!==p.id);
        if(datos.activo === p.id) datos.activo = datos.perros[0].id;
        activarRefs();
        programarGuardado();
        render();
      });
      card.appendChild(btnBorrar);
    }

    lista.appendChild(card);
  });

  if(datos.perros.length === 1){
    const nota = document.createElement('div');
    nota.className = 'sin-series';
    nota.textContent = t('unicoPerfil');
    lista.appendChild(nota);
  }
}

/* ================= CONFIGURACIÓN ================= */
function generarExcel(){
  if(typeof XLSX === 'undefined') return false;
  try{
    const wb = XLSX.utils.book_new();

    /* Hoja 1: Perros + datos veterinarios */
    const filasPerros = datos.perros.map(p=>{
      const v = p.vet || {};
      const fila = {};
      fila[t('nombreCol')] = p.nombre;
      fila[t('sexo')] = p.sexo ? t(p.sexo==='macho'?'macho':'hembra') : '';
      fila[t('raza')] = v.raza || '';
      fila[t('fechaNacimiento')] = v.nacimiento || '';
      fila[t('pesoKg')] = v.peso || '';
      fila[t('castradoQ')] = v.castrado ? t(v.castrado==='si'?'si':'no') : '';
      fila[t('ultimoCelo')] = v.ultimoCelo || '';
      fila[t('antirrabica') + ' — ' + t('ultimaAplicacion')] = v.antirrabicaUltima || '';
      fila[t('antirrabica') + ' — ' + t('proximaRevac')] = v.antirrabicaProxima || '';
      fila[t('sextuple') + ' — ' + t('ultimaAplicacion')] = v.sextupleUltima || '';
      fila[t('sextuple') + ' — ' + t('proximaRevac')] = v.sextupleProxima || '';
      return fila;
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(filasPerros), t('tabPerros'));

    /* Hoja 2: Conductas con acumulados */
    const filasConductas = [];
    datos.perros.forEach(p=>{
      (p.trucos||[]).forEach(tk=>{
        let total=0, exitos=0;
        (tk.series||[]).forEach(s=>{ total+=s.total; exitos+=s.exitos; });
        const fila = {};
        fila[t('perroCol')] = p.nombre;
        fila[t('nombreCol')] = tk.truco;
        fila[t('descripcionTruco')] = tk.descripcion || '';
        fila[t('estadio')] = tk.estadio;
        fila[t('series')] = (tk.series||[]).length;
        fila[t('repeticiones')] = total;
        fila[t('exitos')] = exitos;
        fila[t('tasaExito')] = total>0 ? Math.round(100*exitos/total)+'%' : '';
        filasConductas.push(fila);
      });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(filasConductas), t('tabConductas'));

    /* Hoja 3: Series (una fila por serie) */
    const filasSeries = [];
    datos.perros.forEach(p=>{
      (p.trucos||[]).forEach(tk=>{
        const cant = (tk.series||[]).length;
        (tk.series||[]).forEach((s, idx)=>{
          const fila = {};
          fila[t('perroCol')] = p.nombre;
          fila[t('nombreCol')] = tk.truco;
          fila[t('serie')] = cant - idx;
          fila[t('fechaCol')] = s.fecha ? fechaLegible(s.fecha) : t('registroSinFecha');
          fila[t('estadio')] = (typeof s.estadio === 'number') ? s.estadio : '';
          fila[t('repeticiones')] = s.total;
          fila[t('exitos')] = s.exitos;
          fila[t('tasaExito')] = s.total>0 ? Math.round(100*s.exitos/s.total)+'%' : '';
          fila[t('refuerzoCol')] = s.refuerzo || '';
          fila[t('observacionCol')] = s.obs || '';
          filasSeries.push(fila);
        });
      });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(filasSeries), t('series'));

    /* Hoja 4: Cronograma */
    const DIAS = t('dias');
    const filasCrono = [];
    datos.perros.forEach(p=>{
      (p.cronograma||[]).forEach(c=>{
        const tk = (p.trucos||[]).find(x=>x.id===c.trucoId);
        const fila = {};
        fila[t('perroCol')] = p.nombre;
        fila[t('diaCol')] = DIAS[c.dia] || '';
        fila[t('horaCol')] = c.hora || '';
        fila[t('conducta')] = tk ? tk.truco : t('conductaEliminada');
        fila[t('notaCol')] = c.nota || '';
        filasCrono.push(fila);
      });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(filasCrono), t('tabCrono'));

    XLSX.writeFile(wb, 'adiestramiento.xlsx');
    return true;
  }catch(e){
    return false;
  }
}

function abrirConfig(){
  cerrarConfig();
  const overlay = document.createElement('div');
  overlay.className = 'overlay-config';
  overlay.id = 'overlayConfig';

  const coloresTemas = {
    verde:'#2F5233', oceano:'#1D4E63', terracota:'#9A4A34', lavanda:'#4A3B78', oscuro:'#171B17'
  };
  const nombresTemas = {
    verde:t('temaVerde'), oceano:t('temaOceano'), terracota:t('temaTerracota'),
    lavanda:t('temaLavanda'), oscuro:t('temaOscuro')
  };

  let swatches = '';
  Object.keys(TEMAS).forEach(k=>{
    swatches += `
      <button class="swatch ${cfg.tema===k?'activo':''}" data-tema="${k}">
        <span class="bola" style="background:${coloresTemas[k]}"></span>
        ${nombresTemas[k]}
      </button>`;
  });

  overlay.innerHTML = `
    <div class="panel-config">
      <div class="config-cab">
        <div class="config-titulo">${t('config')}</div>
        <button class="btn-cerrar" id="btnCerrarConfig">✕</button>
      </div>

      <div class="tarjeta">
        <span class="etiqueta">${t('idioma')}</span>
        <select class="selector" id="selIdioma" style="margin-bottom:0">
          <option value="es" ${cfg.idioma==='es'?'selected':''}>Español</option>
          <option value="en" ${cfg.idioma==='en'?'selected':''}>English</option>
          <option value="pt" ${cfg.idioma==='pt'?'selected':''}>Português</option>
        </select>
      </div>

      <div class="tarjeta">
        <span class="etiqueta">${t('colores')}</span>
        <div class="swatches">${swatches}</div>
      </div>

      <div class="tarjeta">
        <span class="etiqueta">${t('exportarTitulo')}</span>
        <div class="nota-vet" style="margin-bottom:10px">${t('excelTexto')}</div>
        <button class="btn-guardar-serie" id="btnExcel" style="margin-top:0">${t('exportarExcel')}</button>
        <div class="aviso-config" id="avisoExcel"></div>

        <span class="sub-etiqueta" style="margin-top:14px">${t('respaldoTexto')}</span>
        <textarea class="area-datos" id="areaExportar" readonly></textarea>
        <button class="btn-guardar-serie" id="btnCopiar" style="margin-top:8px">${t('copiar')}</button>
        <div class="aviso-config" id="avisoExportar"></div>
      </div>

      <div class="tarjeta">
        <span class="etiqueta">${t('importarTitulo')}</span>
        <textarea class="area-datos" id="areaImportar" placeholder="${t('importarPH')}"></textarea>
        <button class="btn-guardar-serie" id="btnImportar" style="margin-top:8px">${t('importarBtn')}</button>
        <div class="aviso-config" id="avisoImportar"></div>
      </div>

      <button class="btn-eliminar-truco" id="btnBorrarTodo">${t('borrarTodo')}</button>
      <div class="aviso-config" id="avisoBorrado"></div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.addEventListener('click', e=>{
    if(e.target === overlay) cerrarConfig();
  });
  overlay.querySelector('#btnCerrarConfig').addEventListener('click', cerrarConfig);

  overlay.querySelector('#selIdioma').addEventListener('change', e=>{
    cfg.idioma = e.target.value;
    programarGuardadoConfig();
    render();
    abrirConfig(); /* redibuja el panel en el nuevo idioma */
  });

  overlay.querySelectorAll('.swatch').forEach(b=>{
    b.addEventListener('click', ()=>{
      cfg.tema = b.dataset.tema;
      aplicarTema();
      programarGuardadoConfig();
      overlay.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('activo', x===b));
    });
  });

  const areaExp = overlay.querySelector('#areaExportar');
  areaExp.value = JSON.stringify(datos);
  const avisoExp = overlay.querySelector('#avisoExportar');

  overlay.querySelector('#btnCopiar').addEventListener('click', async ()=>{
    try{
      await navigator.clipboard.writeText(areaExp.value);
      avisoExp.className = 'aviso-config ok';
      avisoExp.textContent = t('copiado');
    }catch(e){
      areaExp.focus(); areaExp.select();
      avisoExp.className = 'aviso-config err';
      avisoExp.textContent = t('copiarManual');
    }
  });

  const avisoExcel = overlay.querySelector('#avisoExcel');
  overlay.querySelector('#btnExcel').addEventListener('click', ()=>{
    const ok = generarExcel();
    avisoExcel.className = 'aviso-config ' + (ok ? 'ok' : 'err');
    avisoExcel.textContent = ok ? t('excelOk') : t('excelErr');
  });

  const avisoImp = overlay.querySelector('#avisoImportar');
  overlay.querySelector('#btnImportar').addEventListener('click', ()=>{
    const texto = overlay.querySelector('#areaImportar').value.trim();
    try{
      const parsed = JSON.parse(texto);
      if(!parsed || !Array.isArray(parsed.perros)) throw new Error('formato');
      datos = parsed;
      sanearDatos();
      activarRefs();
      vistaActual = null;
      programarGuardado();
      render();
      avisoImp.className = 'aviso-config ok';
      avisoImp.textContent = t('importOk');
      areaExp.value = JSON.stringify(datos);
    }catch(e){
      avisoImp.className = 'aviso-config err';
      avisoImp.textContent = t('importErr');
    }
  });

  const avisoBorrado = overlay.querySelector('#avisoBorrado');
  conConfirmacion(overlay.querySelector('#btnBorrarTodo'), t('borrarTodo'), t('confirmBorrarTodo'), ()=>{
    const p = nuevoPerro(t('miPerro'));
    datos = { activo: p.id, perros: [p] };
    activarRefs();
    vistaActual = null;
    pestana = 'grilla';
    programarGuardado();
    render();
    avisoBorrado.className = 'aviso-config ok';
    avisoBorrado.textContent = t('borradoOk');
    areaExp.value = JSON.stringify(datos);
    const btn = overlay.querySelector('#btnBorrarTodo');
    btn.classList.remove('confirmando');
    btn.innerHTML = t('borrarTodo');
  });
}

function cerrarConfig(){
  const o = document.getElementById('overlayConfig');
  if(o) o.remove();
}

/* ================= RENDER GENERAL ================= */
function render(){
  if(pestana === 'crono'){ renderCronograma(); return; }
  if(pestana === 'vet'){ renderVet(); return; }
  if(pestana === 'perros'){ renderPerros(); return; }
  if(vistaActual){
    const item = items.find(i=>i.id===vistaActual);
    if(item){ renderDetalle(item); return; }
    vistaActual = null;
  }
  renderLista();
}

document.getElementById('btnAgregar').addEventListener('click', ()=>{
  const nuevo = nuevoItem();
  items.unshift(nuevo);
  vistaActual = nuevo.id;
  render(); programarGuardado();
  const input = document.querySelector('.nombre-truco');
  if(input) input.focus();
});

cargar();

/* ===== Service worker: permite abrir la app sin conexión ===== */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* sin SW la app igual funciona */ });
  });
}

/* Aviso si el navegador bloquea el guardado (modo privado, permisos) */
if(!almacenamientoOk){
  window.addEventListener('load', ()=>{
    const aviso = document.createElement('div');
    aviso.style.cssText = 'position:fixed;left:10px;right:10px;bottom:76px;z-index:60;'+
      'background:#B23A3A;color:#fff;padding:12px 14px;border-radius:12px;'+
      'font-size:13px;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.3)';
    aviso.textContent = 'Atención: este navegador no permite guardar datos (modo privado o permisos bloqueados). '+
      'Lo que cargues se perderá al cerrar. Tocá para ocultar.';
    aviso.addEventListener('click', ()=>aviso.remove());
    document.body.appendChild(aviso);
  });
}
